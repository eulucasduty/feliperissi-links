<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe Rissi | Links</title>
  <meta name="description" content="Palavra, vida real e propósito. Todos os links do Felipe Rissi em um só lugar.">
  <meta property="og:title" content="Felipe Rissi | Links">
  <meta property="og:description" content="Palavra • Vida Real • Propósito">
  <meta property="og:image" content="https://feliperissi.com.br/pagina-de-links/img/youtube.webp">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230b0b0d'/><text x='50' y='66' text-anchor='middle' font-family='Georgia,serif' font-size='46' fill='%23c9a45c'>FR</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --text: #f2ede4;
      --muted: #a89f92;
      --gold: #c9a45c;
      --gold-soft: rgba(201, 164, 92, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201, 164, 92, 0.16), transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(120, 20, 20, 0.18), transparent 60%);
      color: var(--text);
      font-family: 'Montserrat', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
      padding: 48px 16px 40px;
    }
    main { width: 100%; max-width: 560px; }

    header { text-align: center; margin-bottom: 36px; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px; font-weight: 600; color: var(--gold);
      border: 1.5px solid var(--gold-soft);
      background: linear-gradient(160deg, #1a1712, #0d0c0a);
      box-shadow: 0 0 0 6px rgba(201,164,92,0.06), 0 20px 40px -20px rgba(201,164,92,0.5);
      letter-spacing: 1px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 1px;
      color: var(--text);
    }
    .tagline {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .ig {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }
    .ig:hover { border-color: var(--gold); color: var(--text); }
    .ig svg { width: 16px; height: 16px; }

    .links { display: flex; flex-direction: column; gap: 18px; }
    .card {
      display: block;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.9);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      text-decoration: none;
      background: #111;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 6;
      object-fit: cover;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--gold-soft);
      box-shadow: 0 26px 50px -18px rgba(0,0,0,0.95), 0 0 0 1px rgba(201,164,92,0.25);
      outline: none;
    }
    .card:active { transform: translateY(-1px) scale(0.995); }
    .card .label {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 28px 18px 12px;
      font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      pointer-events: none;
    }
    .card.soon { opacity: .6; cursor: default; }
    .card.soon:hover { transform: none; border-color: rgba(255,255,255,0.08); }

    footer {
      margin-top: 44px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    footer span { color: var(--gold); }

    @media (max-width: 420px) {
      body { padding-top: 36px; }
      h1 { font-size: 30px; }
      .card img { aspect-ratio: 16 / 7; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">FR</div>
      <h1>Felipe Rissi</h1>
      <p class="tagline">Palavra • Vida Real • Propósito</p>
      <a class="ig" href="https://www.instagram.com/feliperiissi/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        @feliperiissi
      </a>
    </header>

    <nav class="links" aria-label="Links">
      <a class="card" href="https://youtube.com/@feliperissii?si=JRqTO2iqi7ANYQti" target="_blank" rel="noopener">
        <img src="img/youtube.webp" alt="Canal do Felipe Rissi no YouTube" width="1600" height="569" fetchpriority="high">
        <span class="label">YouTube</span>
      </a>

      <a class="card" href="https://www.tiktok.com/@.feliperiissi?_r=1&amp;_t=ZS-99vDPh1VSPU" target="_blank" rel="noopener">
        <img src="img/tiktok.webp" alt="Perfil do Felipe Rissi no TikTok" width="1600" height="900" loading="lazy">
        <span class="label">TikTok</span>
      </a>

      <!-- LINK PENDENTE: troque href="#" pelo link do aplicativo e remova a classe "soon" -->
      <a class="card soon" href="#" aria-disabled="true" title="Em breve">
        <img src="img/tempo-com-pai.webp" alt="Aplicativo Tempo com Pai" width="1600" height="533" loading="lazy">
        <span class="label">Aplicativo • Em breve</span>
      </a>

      <!-- LINK PENDENTE: troque href="#" pelo link do devocional e remova a classe "soon" -->
      <a class="card soon" href="#" aria-disabled="true" title="Em breve">
        <img src="img/devocional.webp" alt="Devocional Um Deus de Processos, 60 dias de uma conversa com Deus" width="1600" height="578" loading="lazy">
        <span class="label">Devocional • Em breve</span>
      </a>
    </nav>
  </main>

  <footer>Felipe Rissi <span>•</span> feliperissi.com.br</footer>

  <script>
    document.querySelectorAll('.card.soon').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>
</html>
